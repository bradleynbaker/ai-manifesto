<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The sovereign ladder</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1120px,100% - 32px);margin:64px auto 96px}
.iso[data-theme="light"]{--anatomy-page:#ebebe5;--anatomy-card:#dfdfd8;--anatomy-paper:#dfdfd8;--anatomy-face:#f3f3ee;--anatomy-top:#f6f6f2;--anatomy-shade-0:#c6c6be;--anatomy-shade-1:#d0d0c9;--anatomy-shade-2:#dadad3;--anatomy-shade-3:#e4e4de;--anatomy-lit-top:#fafaf7;--anatomy-lit-shade:#e6e6e0;--anatomy-hi:#1f1f1d;--anatomy-mid:#7c7c75;--anatomy-lo:#a2a29a;--anatomy-faint:#c2c2ba;--anatomy-lit:#000000;--anatomy-text:#3d3d39;--anatomy-strong:#1b1b19;--anatomy-muted:#66665f}
.iso{--anatomy-weight:.85px}
.iso-page{width:min(1120px,100% - 32px);margin:40px auto 72px}
.iso-plate{padding:76px 28px 64px}
.iso-plate-corners{inset:22px 28px}
.iso-plate-corner{font-size:15px;letter-spacing:.06em}
.iso-plate-corner[data-corner="fig"]{font-size:17px;font-weight:600}
.iso-plate-corner[data-corner="title"]{font-size:20px;font-weight:700;color:var(--anatomy-strong);letter-spacing:.08em}
.iso-plate-corner[data-corner="hint"]{bottom:0;font-size:14px}
.iso-plate-corner[data-corner="readout"]{font-size:22px;font-weight:700;color:var(--anatomy-strong)}
.iso-legend{font-size:17px;line-height:1.55;gap:12px;margin-top:18px;color:var(--anatomy-text)}
.iso-keys{gap:8px 26px}
.iso-swatch{width:22px;height:14px}
.board{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr;align-items:end;gap:6px 16px;margin-top:18px;padding:18px 22px;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);font-family:var(--anatomy-mono);color:var(--anatomy-strong)}
.board .cell{display:grid;gap:6px;min-width:0}
.board .lab{font-size:13px;white-space:nowrap;letter-spacing:.12em;text-transform:uppercase;color:var(--anatomy-muted)}
.board .num{font-size:clamp(26px,4vw,46px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.board .op{font-size:clamp(22px,3vw,36px);color:var(--anatomy-muted);padding-bottom:4px}
.board input.num{width:100%;min-width:0;background:var(--anatomy-face);border:0;box-shadow:inset 0 0 0 1.5px var(--anatomy-hi);padding:6px 10px;color:inherit;font-family:inherit}
.board input.num:focus{outline:3px solid var(--anatomy-hi);outline-offset:2px}
.board .bill .num{color:var(--anatomy-lit)}
.board .note{grid-column:1/-1;font-size:14px;color:var(--anatomy-muted);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.board button{font:inherit;font-size:14px;background:none;border:0;box-shadow:inset 0 0 0 1px var(--anatomy-mid);padding:6px 12px;color:var(--anatomy-text);cursor:pointer}
.board button[hidden]{display:none}
@media (max-width:700px){.board{grid-template-columns:1fr;padding:14px 16px}.board .op{display:none}.board .lab{white-space:normal}.iso-plate-corner[data-corner="hint"]{display:none}.iso-plate-corner{font-size:13px}.iso-plate-corner[data-corner="title"],.iso-plate-corner[data-corner="readout"]{font-size:16px}}

html.embed,html.embed body{height:100%;margin:0;overflow:hidden;background:#ebebe5;color-scheme:light}
html.embed .iso-page{width:100%;height:100%;margin:0}
html.embed .iso-figure{height:100%;margin:0;display:flex;flex-direction:column;gap:14px}
html.embed .iso-plate{flex:1;min-height:0;padding:0;background:none;box-shadow:none;border:0}
html.embed .iso-plate-corners,html.embed .iso-legend{display:none}
html.embed .iso-stage{height:100%;outline:none}
html.embed .iso-svg{width:100%;height:100%}
html.embed .board{margin-top:0;flex:none}
html.embed.no-board .board{display:none}
html.embed.board-side .iso-figure{flex-direction:row;gap:24px}
html.embed.board-side .iso-plate{flex:1;min-width:0}
html.embed.board-side .board{align-self:center;width:min(36%,430px);grid-template-columns:1fr!important;align-content:center;gap:14px 0!important;padding:22px 24px;margin:0}
html.embed.board-side .board .op{display:none!important}
html.embed.board-side .board .note{grid-column:auto!important}
html.embed.board-side .board .num{font-size:clamp(26px,3.4vw,44px)}

.board.ladder-board{grid-template-columns:minmax(0,1.7fr) repeat(4,minmax(0,1fr));gap:8px 18px;align-items:baseline}
.ladder-board .row{display:contents}
.ladder-board .row .num{font-size:clamp(20px,3.4vw,40px);transition:color .35s}
.ladder-board .row[data-on="0"] .num{color:var(--anatomy-faint)}
.ladder-board .row .num.bill{color:var(--anatomy-red)}
.ladder-board .row[data-on="0"] .num.bill{color:var(--anatomy-faint)}
.ladder-board .lab{white-space:normal}
.ladder-board .note{font-size:16px;color:var(--anatomy-text)}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red);stroke-width:2}
@media (max-width:700px){.board.ladder-board{grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr));gap:6px 8px;padding:12px}.ladder-board .row .num{font-size:15px}.ladder-board .lab{font-size:10px;letter-spacing:.04em}}

.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;

// Fig 8 · the sovereign ladder — the one model the tokens, the gate, the board and the readout all read.
// Numbers (Artificial Analysis comparison page, Opus 5 vs Nemotron 3 Ultra; the manifesto's verified appendix):
//   US OPEN  (Nemotron 3 Ultra): intelligence index 38 · $0.58 per M tokens · 100 tokens/s — run inside, uncapped
//   FRONTIER (Opus 5):           intelligence index 61 · $3.85 per M tokens ·  47 tokens/s — rented outside, metered
// Everything else here (token count, spacing, speed, which token goes where) is illustrative choreography.
// This file is inlined into the page with `export ` stripped, so it must stay import-free.
const OPEN = { name: "OPEN", index: 46, price: 0.18, tps: 48 };
const FRONTIER = { name: "FRONTIER", index: 58, price: 2.94, tps: 98 };

// the beats the presenter clicks through
const STATES = ["device", "workgroup", "core", "gate", "all"];
const KEY_STATE = 4;
const RUNG_NAMES = ["DEVICE", "WORKGROUP", "CORE"];
// which destinations show tokens in each state (1–3 = rungs, 4 = through the gate) and how strongly
const SHOW = [
  [1, 0, 0, 0],
  [1, 1, 0, 0],
  [1, 1, 1, 0],
  [0.32, 0.32, 0.32, 1],
  [1, 1, 1, 1],
];
// the rung each state points at (0-based; 3 = the gate, -1 = all)
const FOCUS = [0, 1, 2, 3, -1];

// ---------- world plan the tokens ride on (x, y on the floor, z up) ----------
const LANE_Y = 32;                  // the lane runs along x on every rung and over the deck
const SLOT_Y = 18;                  // the docking sockets sit just behind the lane
const RUNG_X = [-246, -146, -46, 54]; // rung r spans RUNG_X[r] .. RUNG_X[r + 1]
const RUNG_Z = [10, 22, 34];        // rung tops; the deck through the gate is level with rung 3
const GATE_X = 67;                  // the gatehouse in the fence line
const TURN_X = 84;                  // the turnstile hub just outside it
const STAMP_X = 106;                // where the press strips the context tag
const DOOR_X = 140;                 // the frontier tower's door
const TOKEN = { half: 3.5, h: 6, tag: 5 };

// a token's path: out of the router, along the rungs, up each riser, and (for the few) through the gate
const MAIN = [
  [-262, LANE_Y, RUNG_Z[0]],
  [RUNG_X[1] - 4.5, LANE_Y, RUNG_Z[0]],
  [RUNG_X[1] - 4.5, LANE_Y, RUNG_Z[1]],
  [RUNG_X[2] - 4.5, LANE_Y, RUNG_Z[1]],
  [RUNG_X[2] - 4.5, LANE_Y, RUNG_Z[2]],
  [DOOR_X + 8, LANE_Y, RUNG_Z[2]],
];

// 30 tokens a cycle: 9 stop on each rung, 3 go through the gate (illustrative mix: most stay inside)
const N = 30;
const PERIOD = 18;                  // s per cycle
const SPEED = 40;                   // world units per s
const ESCALATE = [6, 7, 21];
const SLOTS = [
  Array.from({ length: 9 }, (_, i) => -236 + i * 10),
  Array.from({ length: 9 }, (_, i) => -136 + i * 10),
  Array.from({ length: 9 }, (_, i) => -36 + i * 10),
];
const TOKENS = (() => {
  const out = [];
  const used = [0, 0, 0];
  let r = 0;
  for (let i = 0; i < N; i++) {
    if (ESCALATE.includes(i)) { out.push({ i, dest: 4, slot: null }); continue; }
    const dest = (r % 3) + 1;
    r++;
    const k = used[dest - 1]++;
    // later arrivals take the nearer sockets, so a token never slides across one already docked
    out.push({ i, dest, slot: SLOTS[dest - 1][SLOTS[dest - 1].length - 1 - k] });
  }
  return out;
})();

function routeOf(token) {
  if (token.dest === 4) return MAIN;
  const r = token.dest - 1;
  // the main line up to this rung's lane, then along it to the socket, then back into the socket
  const upTo = [1, 3, 5][r];
  const pts = MAIN.slice(0, upTo);
  const z = RUNG_Z[r];
  return [...pts, [token.slot, LANE_Y, z], [token.slot, SLOT_Y, z]];
}

const lengthOf = (pts) => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1], p[2] - pts[i][2]), 0);
function along(pts, s) {
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const l = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
    if (s <= l || i === pts.length - 1) {
      const t = l ? Math.min(1, Math.max(0, s / l)) : 1;
      return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
    }
    s -= l;
  }
  return pts[pts.length - 1];
}
const smooth = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };

// where token i is at time t (s): position, opacity, whether it still carries its context tag,
// and how far it has pushed the turnstile / been pressed by the stamp on this pass
function tokenAt(token, t) {
  const pts = routeOf(token);
  const L = lengthOf(pts);
  const since = t - (token.i * PERIOD) / N;
  const cycles = Math.floor(since / PERIOD);
  const tau = since - cycles * PERIOD;
  const s = Math.min(L, tau * SPEED);
  const p = along(pts, s);
  let alpha = smooth(0, 0.5, tau) * (1 - smooth(PERIOD - 1.1, PERIOD - 0.1, tau));
  const out = { p, alpha, tag: 1, turn: 0, press: 0, cycles, dest: token.dest };
  if (token.dest === 4) {
    alpha *= 1 - smooth(DOOR_X - 1, DOOR_X + 6, p[0]); // into the tower's door
    out.alpha = alpha;
    out.turn = smooth(TURN_X - 9, TURN_X + 9, p[0]);
    out.press = Math.max(0, 1 - Math.abs(p[0] - STAMP_X) / 6);
    out.tag = p[0] < STAMP_X ? 1 : 1 - smooth(STAMP_X, STAMP_X + 2, p[0]);
  }
  out.alpha = alpha;
  return out;
}

// the gate's moving parts for time t: turnstile angle (rad), meter count, stamp travel 0..1
function gateAt(t) {
  let passes = 0, press = 0;
  for (const token of TOKENS) {
    if (token.dest !== 4) continue;
    const a = tokenAt(token, t);
    passes += a.cycles + a.turn;
    press = Math.max(press, a.press);
  }
  return { turn: (passes * 2 * Math.PI) / 3, count: passes, press: press * press * (3 - 2 * press) };
}

// the frozen moment each state's still picture shows (and reduced motion holds)
const SNAP_T = (() => {
  const esc = TOKENS.find((tk) => tk.i === ESCALATE[1]);
  const L = lengthOf(MAIN.slice(0, 5)) + (STAMP_X - MAIN[4][0]);
  const atStamp = (esc.i * PERIOD) / N + L / SPEED + PERIOD;
  return [atStamp - 3.2, atStamp - 2.2, atStamp - 1.2, atStamp, atStamp - 0.04];
})();

const STATE_TEXT = ["Rung 1 · device", "Rung 2 · workgroup", "Rung 3 · core", "Gate · frontier, metered", "Three rungs + one gate"];

const P = {"origin":[428.642686850384,285.0000075304529],"scale":0.9875120724303794,"azimuth":112,"elevation":32};
const TURN = [84,40.6], ARM_Z = 46.2, ARM_R = 10, METER = [67,59,41.5], DIAL_R = 7.2, PAD_TRAVEL = 6.4;
const turnstileAt = function turnstileAt(angle) {
  return [0, 1, 2]
    .map((i) => {
      const a = angle + (i * 2 * Math.PI) / 3;
      return lineOnTop([TURN[0], TURN[1]], [TURN[0] + ARM_R * Math.cos(a), TURN[1] + ARM_R * Math.sin(a)], ARM_Z, P);
    })
    .join("");
};
const meterNeedleAt = function meterNeedleAt(count) {
  const a = (count / 10) * 2 * Math.PI;
  return segment(METER, [METER[0] + (DIAL_R - 1.4) * Math.sin(a), METER[1], METER[2] + (DIAL_R - 1.4) * Math.cos(a)], P);
};
const groupOf = (p) => (p[0] < RUNG_X[1] ? 1 : p[0] < RUNG_X[2] ? 2 : p[0] < RUNG_X[3] ? 3 : 4);
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const groups = { 1: svg.querySelector('[data-group="1"]'), 2: svg.querySelector('[data-group="2"]'), 3: svg.querySelector('[data-group="3"]'), 4: svg.querySelector('[data-group="4"]') };
const tokenEls = new Map([...svg.querySelectorAll("[data-token]")].map((el) => [Number(el.dataset.token), el]));
const turnstile = svg.querySelector('[data-part="turnstile"]');
const needle = svg.querySelector('[data-part="needle"]');
const plungerEl = svg.querySelector('[data-part="plunger"]');
const labels = [0, 1, 2].map((r) => svg.querySelector('[data-rung-label="' + r + '"] text'));
const sockets = [0, 1, 2].map((r) => svg.querySelector('[data-sockets="' + r + '"] path'));
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const LAST = STATES.length - 1;
const board = {
  rung: document.querySelector('[data-board="rung"]'),
  inside: document.querySelector('[data-board-row="inside"]'),
  outside: document.querySelector('[data-board-row="outside"]'),
};
const BOARD_RUNG = ["DEVICE", "WORKGROUP", "CORE", "3 RUNGS", "3 RUNGS"];
let state = KEY_STATE, target = KEY_STATE, held = false, touring = true, clock = 0, idle = 0, frame = 0, last = 0, visible = false;
let t = SNAP_T[KEY_STATE];
const weights = SHOW[KEY_STATE].slice();
const TOUR = [4, 4, 0, 1, 2, 3, 3, 4, 4];
const tourAt = (c) => TOUR[Math.floor(c / 2.8) % TOUR.length];
const placed = new Map();
let blink = 1, pending = null;
function lockGate() {
  // the gate beat should show a pass through the press: if none is due in the next few seconds,
  // blink the tokens and pick the flow up 2.4 s before the next escalating pair reaches the stamp
  const wait = Math.min(...[0, 8.4].map((off) => (((SNAP_T[3] + off - t) % PERIOD) + PERIOD) % PERIOD));
  if (wait > 1.2 && wait < 4.5) return;
  const base = SNAP_T[3] - 2.4;
  pending = base + Math.ceil((t - base) / PERIOD) * PERIOD;
}
function setState(i) {
  if (i === state) return;
  state = i;
  if (i === 3 && !still.matches) lockGate();
  const focus = FOCUS[i];
  labels.forEach((el, r) => el && el.setAttribute("data-tone", focus === r || focus === -1 ? "hi" : "lo"));
  sockets.forEach((el, r) => el && el.setAttribute("data-tone", focus === r || focus === -1 ? "mid" : "faint"));
  const text = STATE_TEXT[i];
  if (readout.textContent !== text) readout.textContent = text;
  board.rung.textContent = BOARD_RUNG[i];
  board.inside.dataset.on = i === 3 ? "0" : "1";
  board.outside.dataset.on = i >= 3 ? "1" : "0";
  stage.setAttribute("aria-valuenow", String(i));
  stage.setAttribute("aria-valuetext", text);
}
function draw() {
  const order = { 1: [], 2: [], 3: [], 4: [] };
  for (const token of TOKENS) {
    const el = tokenEls.get(token.i);
    if (!el) continue;
    const a = tokenAt(token, t);
    const w = weights[token.dest - 1] * a.alpha * blink;
    el.setAttribute("transform", translateAlong(P, a.p));
    el.setAttribute("opacity", w.toFixed(3));
    el.setAttribute("visibility", w < 0.01 ? "hidden" : "visible");
    el.firstElementChild.nextElementSibling.setAttribute("visibility", a.tag > 0.02 ? "visible" : "hidden");
    order[groupOf(a.p)].push([depthOf(a.p, P), el]);
  }
  for (const g of [1, 2, 3, 4]) {
    const list = order[g].sort((u, v) => u[0] - v[0]).map((u) => u[1]);
    const prev = placed.get(g) || [];
    if (list.length !== prev.length || list.some((el, i) => el !== prev[i])) {
      for (const el of list) groups[g].appendChild(el);
      placed.set(g, list);
    }
  }
  const gate = gateAt(t);
  turnstile.setAttribute("d", turnstileAt(gate.turn));
  needle.setAttribute("d", meterNeedleAt(gate.count));
  plungerEl.setAttribute("transform", translateAlong(P, [0, 0, -PAD_TRAVEL * gate.press]));
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring) { clock += dt; target = tourAt(clock); }
  setState(target);
  if (calm) t = SNAP_T[state];
  else {
    t += dt;
    if (pending !== null) { blink += (0 - blink) * (1 - Math.exp(-dt / 0.06)); if (blink < 0.03) { t = pending; pending = null; } }
    else blink += (1 - blink) * (1 - Math.exp(-dt / 0.12));
  }
  for (let d = 0; d < 4; d++) {
    const goal = SHOW[state][d];
    weights[d] = calm ? goal : weights[d] + (goal - weights[d]) * (1 - Math.exp(-dt / 0.35));
  }
  draw();
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const steer = (next) => {
  touring = false;
  target = clamp(Math.round(next), 0, LAST);
  clearTimeout(idle);
  idle = setTimeout(() => { touring = !still.matches && !held; clock = 0; run(); }, 4200);
  if (still.matches) { setState(target); t = SNAP_T[target]; for (let d = 0; d < 4; d++) weights[d] = SHOW[target][d]; draw(); }
  run();
};
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
if (still.matches) touring = false;
stage.addEventListener("pointermove", (event) => {
  const box = svg.getBoundingClientRect();
  steer(clamp(((event.clientX - box.left) / box.width - 0.08) / 0.84, 0, 1) * LAST);
});
stage.addEventListener("keydown", (event) => {
  let to = null;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = Math.min(LAST, target + 1);
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = Math.max(0, target - 1);
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = LAST;
  if (to === null) return;
  event.preventDefault();
  steer(to);
});
window.figureApi = {
  states: STATES.slice(),
  set(i) {
    held = true; touring = false; clearTimeout(idle);
    target = clamp(Math.round(i), 0, LAST);
    if (still.matches) { setState(target); t = SNAP_T[target]; for (let d = 0; d < 4; d++) weights[d] = SHOW[target][d]; draw(); }
    run();
  },
  hold() { held = true; touring = false; clearTimeout(idle); },
};

;(() => {
  const q = new URLSearchParams(location.search);
  const root = document.documentElement;
  if (q.get("embed") === "1") root.classList.add("embed");
  if (q.get("board") === "0") root.classList.add("no-board");
  if (q.get("board") === "side") root.classList.add("board-side");
  const api = () => window.figureApi;
  const go = (i) => { const a = api(); if (a && Number.isFinite(i)) a.set(Math.max(0, Math.min(a.states.length - 1, i))); };
  if (q.has("state")) go(Number(q.get("state")));
  if (q.get("still") === "1" && api() && api().hold) api().hold();
  addEventListener("message", (e) => { const d = e.data; if (d && d.anatomy === "set") go(Number(d.state)); });
  if (parent !== window) parent.postMessage({ anatomy: "ready", states: api() ? api().states : [] }, "*");
})();
