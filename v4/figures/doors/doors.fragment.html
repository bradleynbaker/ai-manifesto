</div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Front door: a metered turnstile, enterprise contract, not trained on</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Side door: wedged open onto personal accounts, training on, 5-year retention</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Packets: work leaving the desks (illustrative flow)</span></span><span class="iso-caption">Two ways out of the same office. Under the enterprise contract the work leaves through a metered turnstile and is not trained on. Cap the turnstile and the bar drops, but the work does not stop: it backs up, then goes out the side door into personal accounts, where consumer terms carry the training setting and keep data five years if it is on. In PagerDuty's survey of 1,250 office professionals at companies with $500M or more in revenue (June 11 2026), 66% had used AI tools they believed weren't allowed, 88% had shared work information through them, and 81% believe leadership plays by different rules. Consumer terms: Anthropic, August 2025 (consumer plans carry the training setting, with 5-year retention if it is on; commercial, enterprise, API and government traffic is excluded from training). The packet flow, the corner office leaving first and the turnstile's count are illustrative.</span></figcaption></figure>
